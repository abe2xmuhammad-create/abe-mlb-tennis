[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abe-mlb-tennis"
version = "0.1.0"
description = "Grounded, zero-hallucination LLM commentary layered over MLB board/scoring output"
readme = "README.md"
# The code uses PEP 604 unions (str | None) and PEP 585 generics (list[dict]).
# `from __future__ import annotations` defers evaluation, but mypy and
# typing.get_type_hints() still need the runtime to support the syntax.
requires-python = ">=3.10"
dependencies = ["requests>=2.31,<3"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools]
py-modules = ["llm_provider", "rag_context", "rag_analyze"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "RET",  # return semantics
    "PTH",  # pathlib over os.path
    "BLE",  # blind except
    "S",    # bandit rules
    "RUF",  # ruff-specific
]
ignore = [
    "E501",    # line length is handled by the formatter
    "S101",    # assert is correct in tests
    "S311",    # no crypto use of random here
    "RUF001",  # em dash in docstrings is intentional
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "PTH123"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
files = ["llm_provider.py", "rag_context.py", "rag_analyze.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
